info:
  name: Login User
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/api/users/login
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "username": "user1",
        "password": "pass123"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
