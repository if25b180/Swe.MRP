info:
  name: Update Rating
  type: http
  seq: 3

http:
  method: PUT
  url: http://localhost:8080/api/ratings/1
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "stars": 4,
        "comment": "Updated comment"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
