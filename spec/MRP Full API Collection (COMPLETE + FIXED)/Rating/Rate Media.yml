info:
  name: Rate Media
  type: http
  seq: 1

http:
  method: POST
  url: http://localhost:8080/api/media/1/rate
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "stars": 5,
        "comment": "Amazing movie!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
