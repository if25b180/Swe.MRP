info:
  name: Get Recommendations by Genre
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8080/api/users/1/recommendations?type=genre
  params:
    - name: type
      value: genre
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
