info:
  name: Search & Filter Media
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8080/api/media?title=incep&genre=sci-fi&sortBy=score
  params:
    - name: title
      value: incep
      type: query
    - name: genre
      value: sci-fi
      type: query
    - name: sortBy
      value: score
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
